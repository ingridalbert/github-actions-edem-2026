name: Ej1 - Variables de entorno globales

on:
  workflow_dispatch:

# Variable definida a nivel de workflow: visible en todos los jobs
env:
  CURSO: "EDEM 2026"

jobs:
  job-uno:
    runs-on: ubuntu-latest
    steps:
      - name: Leer variable global
        run: echo "Job 1 -> curso $CURSO"

  job-dos:
    runs-on: ubuntu-latest
    steps:
      - name: Leer variable global
        run: echo "Job 2 -> curso ${{ env.CURSO }}"
