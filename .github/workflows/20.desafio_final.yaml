name: Desafío final - Pipeline de datos seguro

on:
  workflow_dispatch:
    inputs:
      security_tests:
        description: "¿Ejecutar los Tests de Seguridad?"
        type: choice
        options:
          - "si"
          - "no"
        default: "si"
        required: true

jobs:
  # =========================
  # 1. CI & SEGURIDAD
  # =========================
  ci-seguridad:
    name: CI & Seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar ventas.json
        run: python -m json.tool ventas.json > /dev/null && echo "ventas.json es un JSON válido"

      - name: Escaneo de seguridad (claves API)
        if: ${{ inputs.security_tests == 'si' }}
        run: python scripts/security_scan.py

  # =========================
  # 2. PROCESAMIENTO
  # =========================
  procesamiento:
    name: Procesamiento (${{ matrix.entorno }})
    runs-on: ubuntu-latest
    needs: ci-seguridad
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Generar reporte
        run: |
          python - <<'PY'
          import json
          entorno = "${{ matrix.entorno }}"
          ventas = json.load(open("ventas.json"))["ventas"]
          total = sum(v["importe"] for v in ventas)
          with open(f"reporte_{entorno}.txt", "w") as f:
              f.write(f"Reporte de ventas - entorno: {entorno}\n")
              f.write(f"Nº de ventas: {len(ventas)}\n")
              f.write(f"Total: {total:.2f} EUR\n")
          PY
          cat reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  # =========================
  # 3. NOTIFICACIÓN
  # =========================
  notificacion:
    name: Notificación de éxito
    runs-on: ubuntu-latest
    needs: [ci-seguridad, procesamiento]
    if: success()
    steps:
      - name: Notificar a Discord (simulado)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          echo "Enviando notificación a: $DISCORD_WEBHOOK"   # sale como ***
          echo "Pipeline completado. Reportes disponibles como artefactos."
