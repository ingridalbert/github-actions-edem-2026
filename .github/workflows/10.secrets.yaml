name: Ej2 - Manejo de secretos

on:
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Simular login
        env:
          USUARIO: ingrid
          PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: |
          echo "Haciendo login como $USUARIO"
          echo "Password usada: $PASSWORD"   # en el log aparece como ***
          if [ -z "$PASSWORD" ]; then
            echo "::error::El secreto MY_PASSWORD no está configurado"
            exit 1
          fi
          echo "Login OK"
