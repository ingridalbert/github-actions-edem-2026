name: Ej4 - Artefactos

on:
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Crear archivo
        run: echo "Hola desde el Job 1 (run ${{ github.run_number }})" > mensaje.txt

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mensaje
          path: mensaje.txt

  leer:
    runs-on: ubuntu-latest
    needs: generar
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: mensaje

      - name: Mostrar contenido
        run: cat mensaje.txt
