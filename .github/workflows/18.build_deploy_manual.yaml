name: Ej10 - Build y Deploy manual

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Construyendo la app..."

  deploy:
    runs-on: ubuntu-latest
    needs: build                     # solo si build termina bien
    if: success() && github.event_name == 'workflow_dispatch'
    environment: production          # aprobación manual (required reviewers)
    steps:
      - name: Deploy
        run: echo "Desplegando en producción (lanzado por ${{ github.actor }})"
